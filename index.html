<!DOCTYPE html>
<html>
<head>
<title>Portfolio</title>

<style>

body{
    background:black;
    color:white;
    min-height:100vh;
    margin:0;
    font-family:Arial;
}


/* Center Animation */
.loader{
    position:absolute;
    top:50%;
    left:50%;
    width:100px;
    height:100px;
    border:4px solid #38BDF8;
    box-shadow:0 0 25px #38BDF8;
    transform:translate(-50%,-50%);
    animation:centerBox 2s ease forwards;
}


/* Move animation away and hide */
@keyframes centerBox{

    0%{
        transform:translate(-50%,-50%) scale(0);
        opacity:0;
    }

    50%{
        transform:translate(-50%,-50%) scale(1.5);
        opacity:1;
    }

    100%{
        transform:translate(-50%,-50%) scale(1);
        opacity:0;
    }
}


/* Portfolio content */

.content{
    text-align:center;
    padding-top:150px;
    opacity:0;
    animation:showContent 1.5s ease forwards;
    animation-delay:2s;
}


.name{
    font-size:50px;
}

.focus{
    color:#38BDF8;
}


.intro{
    max-width:700px;
    margin:auto;
}

.intro p{
    color:#ccc;
    font-size:18px;
}


.skills span{
    display:inline-block;
    margin:10px;
    padding:10px 25px;
    border:2px solid #38BDF8;
    border-radius:20px;
    color:#38BDF8;
}


@keyframes showContent{

    from{
        opacity:0;
        transform:translateY(50px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

</head>


<body>


<!-- First Center Animation -->
<div class="loader"></div>


<!-- After Animation -->
<div class="content">

<h1 class="name">
VAVITIKALUVA <span class="focus">MANOJ KUMAR</span>
</h1>


<div class="intro">

<h2>Web Developer</h2>

<p>
Hello! I am Manoj Kumar. I create modern and responsive websites
using HTML, CSS and JavaScript. I love learning new technologies
and building creative projects.
</p>

</div>


<h2>My Skills</h2>

<div class="skills">

<span>HTML</span>
<span>CSS</span>
<span>JavaScript</span>
<span>Python</span>
<span>GitHub</span>
<span>SQL</span>

</div>

</div>


</body>
</html>
